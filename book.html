<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Book details — The Book Nook">
  <title>Book Details — The Book Nook</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #f5f0e8; --bg-card: #fffdf7; --text-dark: #2c1810;
      --text-mid: #6b4c32; --text-light: #9c7a5a; --gold: #c9a84c;
      --gold-dark: #8b6914; --gold-pale: rgba(201,168,76,0.12);
      --border: #e0d4be; --shadow-sm: 0 2px 10px rgba(44,24,16,0.07);
      --shadow-md: 0 8px 28px rgba(44,24,16,0.14);
      --shadow-cover: 0 24px 64px rgba(44,24,16,0.35);
      --header: #2c1810; --radius: 14px; --t: 0.3s ease;
    }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text-dark); font-family: 'Lato', sans-serif; min-height: 100vh; display: flex; flex-direction: column; }
    header { background: var(--header); padding: 0 2rem; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 24px rgba(0,0,0,0.4); }
    .header-inner { max-width: 1200px; margin: 0 auto; display: flex; align-items: center; justify-content: space-between; height: 68px; }
    .logo { display: flex; align-items: center; gap: 0.65rem; text-decoration: none; }
    .logo-icon { font-size: 1.9rem; }
    .logo-name { font-family: 'Playfair Display', serif; font-size: 1.45rem; font-weight: 700; color: var(--gold); }
    .header-sub { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2.5px; color: #9c7a5a; font-weight: 300; }

    /* Breadcrumb */
    .breadcrumb-bar { background: var(--bg-card); border-bottom: 1px solid var(--border); padding: 0.75rem 2rem; }
    .breadcrumb-inner { max-width: 1200px; margin: 0 auto; }
    .back-link { display: inline-flex; align-items: center; gap: 0.5rem; font-size: 0.82rem; font-weight: 700; color: var(--text-mid); text-decoration: none; text-transform: uppercase; letter-spacing: 1px; transition: color var(--t), gap var(--t); }
    .back-link:hover { color: var(--gold-dark); gap: 0.7rem; }
    .back-arrow { font-size: 1.1rem; transition: transform var(--t); }
    .back-link:hover .back-arrow { transform: translateX(-3px); }

    /* Hero band */
    .detail-hero { background: linear-gradient(145deg, #1a0c06 0%, #2c1810 50%, #3a1e0e 100%); padding: 4rem 2rem; position: relative; overflow: hidden; }
    .detail-hero::before { content: ''; position: absolute; inset: 0; background-image: radial-gradient(rgba(201,168,76,0.05) 1px, transparent 1px); background-size: 28px 28px; }
    .detail-hero::after { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse at 70% 50%, rgba(201,168,76,0.08) 0%, transparent 60%); }

    .detail-grid { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; display: grid; grid-template-columns: 280px 1fr; gap: 4rem; align-items: start; }

    /* Cover */
    .book-cover-col { position: relative; }
    .cover-frame { position: relative; border-radius: 10px; overflow: hidden; box-shadow: var(--shadow-cover); }
    .cover-frame img { width: 100%; display: block; border-radius: 10px; }
    .cover-shimmer { position: absolute; top: 0; left: 0; width: 30%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent); }

    /* Info panel */
    .book-info-col { color: #f5f0e8; padding-top: 0.5rem; }
    .genre-pill { display: inline-block; background: rgba(201,168,76,0.15); border: 1px solid rgba(201,168,76,0.35); color: var(--gold); font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; padding: 0.3rem 0.9rem; border-radius: 50px; margin-bottom: 1.2rem; }
    .book-title-hero { font-family: 'Playfair Display', serif; font-size: clamp(1.8rem, 4vw, 2.9rem); font-weight: 700; line-height: 1.2; margin-bottom: 0.6rem; color: #f5f0e8; }
    .book-author-hero { font-size: 1.05rem; font-weight: 300; color: #b8956a; margin-bottom: 2rem; letter-spacing: 0.3px; }

    /* Info grid */
    .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: rgba(201,168,76,0.15); border: 1px solid rgba(201,168,76,0.2); border-radius: 12px; overflow: hidden; margin-bottom: 2rem; }
    .info-item { background: rgba(26,12,6,0.5); padding: 1rem 1.25rem; }
    .info-label { font-size: 0.62rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2px; color: #806040; margin-bottom: 0.3rem; }
    .info-value { font-family: 'Playfair Display', serif; font-size: 1.05rem; color: #f5f0e8; }

    /* Rating stars placeholder */
    .rating-row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 2rem; }
    .stars { color: var(--gold); font-size: 1.1rem; letter-spacing: 2px; }

    /* Synopsis in hero area */
    .synopsis-hero { font-size: 0.98rem; font-weight: 300; color: #c0a070; line-height: 1.85; border-left: 2px solid rgba(201,168,76,0.4); padding-left: 1.25rem; }

    /* Main content area */
    main { flex: 1; max-width: 1100px; margin: 0 auto; width: 100%; padding: 3rem 2rem 5rem; }

    /* Synopsis section */
    .synopsis-section { background: var(--bg-card); border-radius: var(--radius); border: 1px solid var(--border); padding: 2.5rem; box-shadow: var(--shadow-sm); position: relative; overflow: hidden; margin-bottom: 2rem; }
    .synopsis-section::before { content: '\201C'; position: absolute; top: -0.3rem; left: 1.5rem; font-family: 'Playfair Display', serif; font-size: 8rem; color: rgba(201,168,76,0.12); line-height: 1; pointer-events: none; }
    .synopsis-label { font-size: 0.7rem; font-weight: 700; text-transform: uppercase; letter-spacing: 2.5px; color: var(--gold-dark); margin-bottom: 1rem; position: relative; z-index: 1; display: flex; align-items: center; gap: 0.75rem; }
    .synopsis-label::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .synopsis-text { font-size: 1.05rem; line-height: 1.9; color: var(--text-mid); position: relative; z-index: 1; font-weight: 400; }

    /* Details grid */
    .details-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; }
    .detail-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 1.25rem 1.5rem; box-shadow: var(--shadow-sm); display: flex; align-items: center; gap: 1rem; }
    .detail-icon { font-size: 1.6rem; width: 44px; text-align: center; flex-shrink: 0; }
    .detail-card-label { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1.8px; color: var(--text-light); margin-bottom: 0.2rem; }
    .detail-card-value { font-family: 'Playfair Display', serif; font-size: 1rem; color: var(--text-dark); font-weight: 600; }

    /* Not found */
    .not-found { text-align: center; padding: 6rem 2rem; }
    .not-found h2 { font-family: 'Playfair Display', serif; font-size: 2rem; color: var(--text-mid); margin-bottom: 1rem; }
    .not-found a { color: var(--gold-dark); font-weight: 700; }

    footer { background: var(--header); color: #7a5840; text-align: center; padding: 1.75rem 2rem; font-size: 0.82rem; font-weight: 300; letter-spacing: 0.5px; }
    footer b { color: var(--gold); font-weight: 700; }

    @keyframes fadeIn { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
    .animate-in { animation: fadeIn 0.5s ease both; }

    @media (max-width: 768px) {
      .detail-grid { grid-template-columns: 1fr; gap: 2rem; }
      .book-cover-col { max-width: 240px; margin: 0 auto; }
      .book-info-col { text-align: center; }
      .info-grid { grid-template-columns: 1fr 1fr; }
      .synopsis-hero { border-left: none; border-top: 2px solid rgba(201,168,76,0.4); padding-left: 0; padding-top: 1rem; text-align: left; }
      .genre-pill { margin: 0 auto 1.2rem; }
      .rating-row { justify-content: center; }
      .detail-hero { padding: 2.5rem 1.5rem; }
      main { padding: 2rem 1.5rem 4rem; }
    }
    @media (max-width: 480px) {
      .info-grid { grid-template-columns: 1fr; }
      .details-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <a href="index.html" class="logo" id="logo-home">
      <span class="logo-icon">📚</span>
      <div class="logo-name">The Book Nook</div>
    </a>
    <div class="header-sub">A Curated Collection</div>
  </div>
</header>

<div class="breadcrumb-bar">
  <div class="breadcrumb-inner">
    <a href="index.html" class="back-link" id="back-link">
      <span class="back-arrow">&#8592;</span> Back to Library
    </a>
  </div>
</div>

<div id="detail-hero-wrap"></div>
<main id="main-content"></main>

<footer>
  <p>Crafted with <b>&#9829;</b> for Readers &nbsp;&middot;&nbsp; &copy; 2025 <b>The Book Nook</b></p>
</footer>

<script>
const books = [
  { id:1, title:"Life of Pi", author:"Yann Martel", year:2001, genre:"Adventure", genreLabel:"Adventure / Philosophical Fiction", pages:319, cover:"covers/life_of_pi.jpg", synopsis:"A young Indian boy named Pi Patel survives a catastrophic shipwreck in the Pacific Ocean and finds himself adrift on a lifeboat with a Bengal tiger named Richard Parker. Over 227 harrowing days at sea, Pi must summon every ounce of ingenuity, faith, and courage to survive alongside the magnificent beast. A magical and deeply moving novel that blurs the boundary between reality and imagination — and asks us what we truly believe in, and why." },
  { id:2, title:"The Chime Seekers", author:"Ross Montgomery", year:2021, genre:"Fantasy", genreLabel:"Middle Grade Fantasy", pages:384, cover:"covers/the_chime_seekers.jpg", synopsis:"When Yanni's little sister Ari is stolen away by faeries on a midsummer night, he embarks on a desperate adventure into the magical realm of the Fay to bring her home. Guided by an unlikely band of companions and armed only with his wits, Yanni must navigate a world of ancient magic, impossible bargains, and breathtaking wonder — all before the last chime sounds. A thrilling and enchanting tale of bravery, love, and the unbreakable bonds of family." },
  { id:3, title:"Six of Crows", author:"Leigh Bardugo", year:2015, genre:"Fantasy", genreLabel:"YA Fantasy", pages:465, cover:"covers/six_of_crows.jpg", synopsis:"Criminal prodigy Kaz Brekker is offered a chance at the most daring heist imaginable — one that could make him and his crew unimaginably rich. But to pull it off, he needs a team of six brilliant, dangerous outcasts: a convict, a sharpshooter, a runaway, a spy, a Heartrender, and a thief. Each harbors their own secrets. Each has reasons to betray the others. A gripping tale of ambition, loyalty, and found family set in a richly imagined world of Grisha magic." },
  { id:4, title:"Scarlet", author:"Marissa Meyer", year:2013, genre:"Sci-Fi", genreLabel:"YA Sci-Fi / Fairy-Tale Retelling", pages:454, cover:"covers/scarlet.jpg", synopsis:"Cinder, the gifted cyborg mechanic, has escaped prison and continues her desperate fight to expose the ruthless Lunar Queen Levana. Meanwhile, farm girl Scarlet Benoit's grandmother has vanished without a trace, and her investigation leads her to a magnetic and dangerous street fighter named Wolf. A thrilling, action-packed retelling of Little Red Riding Hood woven into a futuristic world of androids, cyborgs, and interplanetary political intrigue." },
  { id:5, title:"Lord of Mysteries, Vol. 1", author:"Cuttlefish That Loves Diving", year:2025, genre:"Fantasy", genreLabel:"Dark Fantasy / Steampunk", pages:580, cover:"covers/lord_of_mysteries.jpg", synopsis:"In a Victorian-era steampunk world where supernatural powers are obtained through mysterious Sequences, Zhou Mingrui awakens in a stranger's body with fragmented memories and an ominous sealed letter. Navigating a labyrinth of secret societies, occult orders, and eldritch horrors lurking beneath gaslit streets, he must uncover the truth about his unexplained death — and the ancient watching entity known only as the Lord of Mysteries. An intricately layered dark fantasy that rewards every page." },
  { id:6, title:"The Maidens", author:"Alex Michaelides", year:2021, genre:"Thriller", genreLabel:"Mystery / Thriller", pages:352, cover:"covers/the_maidens.jpg", synopsis:"When a student at Cambridge University is found brutally murdered, group therapist Mariana Andros travels to the ancient campus to support her grieving niece. She quickly becomes obsessed with Edward Fosca — a charismatic professor of Greek tragedy idolized by a secret society of female students called The Maidens. Everyone believes Fosca is innocent. Everyone except Mariana. A dark, hypnotic thriller steeped in Greek mythology, twisted psychology, and breathtaking suspense." },
  { id:7, title:"The Light Beyond the Garden Wall", author:"Scott Whitehead", year:2019, genre:"Historical", genreLabel:"Historical / Biblical Fiction", pages:176, cover:"covers/the_light_beyond_the_garden_wall.jpg", synopsis:"A profound and intimate journey through the Biblical landscape of ancient Israel, following a young man's spiritual pilgrimage of faith, doubt, and divine encounter. Set against the sweeping backdrop of sacred history, this quietly powerful story asks what it truly means to seek God — and what light awaits beyond the walls we erect around our own hearts. A moving meditation on hope, redemption, and the path that leads us home." },
  { id:8, title:"Little Women", author:"Louisa May Alcott", year:1868, genre:"Classic", genreLabel:"Classic", pages:759, cover:"covers/little_women.jpg", synopsis:"The beloved story of four sisters — spirited Jo, gentle Meg, shy Beth, and ambitious Amy — growing up in New England during the Civil War era while their father serves as a military chaplain. As they navigate love, loss, creative ambition, and the pressures of society, each sister must forge her own path to womanhood. A timeless and deeply human portrait of family, courage, and the joy of becoming who you are truly meant to be, cherished by generations of readers worldwide." },
  { id:9, title:"Pride and Prejudice", author:"Jane Austen", year:1813, genre:"Classic", genreLabel:"Classic", pages:432, cover:"covers/pride_and_prejudice.jpg", synopsis:"The witty and spirited Elizabeth Bennet must navigate the marriage-obsessed pressures of 19th-century English society while her mother schemes to secure husbands for all five Bennet daughters. Her stormy first encounter with the proud and wealthy Mr. Darcy sparks a battle of sharp wit, stubborn pride, and slowly softening hearts. A masterpiece of romantic comedy and incisive social satire — as dazzling, funny, and moving today as the day it was first published." },
  { id:10, title:"The Handmaid's Tale", author:"Margaret Atwood", year:1985, genre:"Dystopian", genreLabel:"Dystopian Fiction", pages:311, cover:"covers/the_handmaids_tale.jpg", synopsis:"In the near future, the United States has been replaced by Gilead — a theocratic military dictatorship where fertile women called Handmaids are forced to bear children for the ruling class. Offred, assigned to a powerful Commander and his wife, tells her story in stolen whispers: a record of daily survival, quiet resistance, and the desperate hope for freedom. A chilling, unforgettable, and profoundly prescient vision of what power can do — and what it cannot break." }
];

function getBookId() {
  var params = new URLSearchParams(window.location.search);
  return parseInt(params.get('id'));
}

function renderBook(book) {
  document.title = book.title + ' — The Book Nook';
  document.querySelector('meta[name="description"]').setAttribute('content', book.title + ' by ' + book.author + ' — ' + book.genreLabel);

  var heroWrap = document.getElementById('detail-hero-wrap');
  heroWrap.innerHTML =
    '<section class="detail-hero animate-in">' +
      '<div class="detail-grid">' +
        '<div class="book-cover-col">' +
          '<div class="cover-frame">' +
            '<img src="' + book.cover + '" alt="' + book.title + ' book cover" id="book-cover-img" onerror="this.style.minHeight=\'380px\';this.style.background=\'linear-gradient(135deg,#c8b89a,#a89070)\';this.style.display=\'block\';this.removeAttribute(\'src\')">' +
            '<div class="cover-shimmer"></div>' +
          '</div>' +
        '</div>' +
        '<div class="book-info-col">' +
          '<div class="genre-pill">' + book.genreLabel + '</div>' +
          '<h1 class="book-title-hero">' + book.title + '</h1>' +
          '<p class="book-author-hero">by ' + book.author + '</p>' +
          '<div class="info-grid">' +
            '<div class="info-item"><div class="info-label">Year Published</div><div class="info-value">' + book.year + '</div></div>' +
            '<div class="info-item"><div class="info-label">Genre</div><div class="info-value">' + book.genre + '</div></div>' +
            '<div class="info-item"><div class="info-label">Pages</div><div class="info-value">' + (book.pages ? book.pages + ' pages' : 'N/A') + '</div></div>' +
            '<div class="info-item"><div class="info-label">Author</div><div class="info-value">' + book.author.split(' ')[book.author.split(' ').length - 1] + '</div></div>' +
          '</div>' +
          '<p class="synopsis-hero">' + book.synopsis + '</p>' +
        '</div>' +
      '</div>' +
    '</section>';

  var main = document.getElementById('main-content');
  main.innerHTML =
    '<div class="synopsis-section animate-in" style="animation-delay:0.15s">' +
      '<div class="synopsis-label">Synopsis</div>' +
      '<p class="synopsis-text">' + book.synopsis + '</p>' +
    '</div>' +
    '<div class="details-grid animate-in" style="animation-delay:0.25s">' +
      '<div class="detail-card"><div class="detail-icon">📅</div><div><div class="detail-card-label">Published</div><div class="detail-card-value">' + book.year + '</div></div></div>' +
      '<div class="detail-card"><div class="detail-icon">✍️</div><div><div class="detail-card-label">Author</div><div class="detail-card-value">' + book.author + '</div></div></div>' +
      '<div class="detail-card"><div class="detail-icon">📖</div><div><div class="detail-card-label">Pages</div><div class="detail-card-value">' + (book.pages ? book.pages : 'N/A') + '</div></div></div>' +
      '<div class="detail-card"><div class="detail-icon">🏷️</div><div><div class="detail-card-label">Genre</div><div class="detail-card-value">' + book.genreLabel + '</div></div></div>' +
    '</div>';
}

function renderNotFound() {
  document.getElementById('detail-hero-wrap').innerHTML = '';
  document.getElementById('main-content').innerHTML =
    '<div class="not-found">' +
      '<h2>Book not found</h2>' +
      '<p>Sorry, we could not find that book. <a href="index.html">Return to the library</a>.</p>' +
    '</div>';
}

var id = getBookId();
var book = books.find(function(b) { return b.id === id; });
if (book) { renderBook(book); } else { renderNotFound(); }
</script>
</body>
</html>
